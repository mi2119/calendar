<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>年間カレンダー｜土曜始まり</title>
<style>
  :root{
    --zenn:#3ea8ff;
    --zenn-dark:#258fd8;
    --ink:#25292e;
    --muted:#7b8793;
    --bg:#f6f8fa;
    --card:#fff;
    --line:#e5eaef;
    --sat:#2878c8;
    --sun:#d95763;
    --holiday:#e14f5d;
    --holiday-bg:#fff0f2;
    --important:#7a5af8;
    --important-bg:#f3f0ff;
    --other:#3b8f67;
    --other-bg:#eef9f4;
    --today:#fff8d8;
    --today-line:#e8c84a;
    --shadow:0 10px 30px rgba(32,43,54,.08);
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",
                "Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 0%,rgba(62,168,255,.10),transparent 28rem),
      var(--bg);
  }

  button,select,textarea{font:inherit}

  .page{
    width:min(1280px,calc(100% - 28px));
    margin:0 auto;
    padding:22px 0 36px;
  }

  .hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:14px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-mark{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border-radius:13px;
    color:#fff;
    font-weight:900;
    font-size:19px;
    background:linear-gradient(145deg,#63bbff,var(--zenn));
    box-shadow:0 8px 20px rgba(62,168,255,.28);
  }

  h1{
    margin:0;
    font-size:24px;
    letter-spacing:.02em;
  }

  .subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:13px;
  }

  .toolbar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    padding:10px;
    background:rgba(246,248,250,.90);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(229,234,239,.95);
    border-radius:14px;
  }

  .control{
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 12px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:.16s ease;
  }

  .control:hover{
    border-color:#cbd7df;
    background:#fbfdff;
    transform:translateY(-1px);
  }

  .control.primary{
    color:#fff;
    border-color:var(--zenn);
    background:var(--zenn);
  }

  .control.primary:hover{
    border-color:var(--zenn-dark);
    background:var(--zenn-dark);
  }

  .spacer{flex:1 1 auto}

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:center;
    margin:0 2px 12px;
    color:var(--muted);
    font-size:12px;
  }

  .legend-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
  }

  .dot.today{background:var(--today-line)}
  .dot.holiday{background:var(--holiday)}
  .dot.important{background:var(--important)}

  .calendar-shell{
    height:calc(100vh - 200px);
    min-height:520px;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
  }

  table{
    width:100%;
    min-width:930px;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
  }

  thead th{
    position:sticky;
    top:0;
    z-index:30;
    height:42px;
    padding:0 8px;
    background:rgba(250,252,253,.97);
    border-bottom:1px solid var(--line);
    color:#52606b;
    font-size:13px;
    font-weight:800;
  }

  thead th:first-child{width:82px}
  thead .sat-head{color:var(--sat)}
  thead .sun-head{color:var(--sun)}

  tbody th{
    position:sticky;
    left:0;
    z-index:16;
    width:82px;
    padding:6px;
    background:#fbfcfd;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    text-align:center;
    color:#8a949d;
    font-size:11px;
    font-weight:750;
  }

  td{
    position:relative;
    height:82px;
    vertical-align:top;
    padding:7px 8px 6px;
    background:#fff;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  td:last-child,thead th:last-child{border-right:0}
  tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}

  tbody tr:hover td,
  tbody tr:hover th{
    background-color:#fbfdff;
  }

  td.outside{
    color:#b3bbc2;
    background:#fafbfc;
  }

  td.today{
    background:var(--today);
    box-shadow:inset 0 0 0 2px var(--today-line);
    z-index:2;
  }

  tbody tr:hover td.today{
    background:var(--today);
  }

  td.month-start::before{
    content:"";
    position:absolute;
    inset:0 auto 0 -1px;
    width:3px;
    background:var(--zenn);
  }

  .date-row{
    min-height:24px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .day-number{
    font-size:14px;
    font-weight:850;
    line-height:1;
  }

  .sat .day-number{color:var(--sat)}
  .sun .day-number{color:var(--sun)}
  .holiday-cell .day-number{color:var(--holiday)}

  .month-chip{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:3px 7px;
    color:#fff;
    background:var(--zenn);
    font-size:10px;
    line-height:1;
    font-weight:800;
  }

  .today-chip{
    margin-left:auto;
    border-radius:999px;
    padding:3px 6px;
    color:#7d6510;
    background:#ffe98d;
    font-size:9px;
    font-weight:900;
  }

  .badges{
    display:grid;
    gap:4px;
    margin-top:4px;
  }

  .badge{
    display:block;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    border-radius:7px;
    padding:4px 6px;
    font-size:10px;
    line-height:1.15;
    font-weight:750;
  }

  .badge.holiday{
    color:var(--holiday);
    background:var(--holiday-bg);
    border:1px solid #ffd7dd;
  }

  .badge.important{
    color:#6046d6;
    background:var(--important-bg);
    border:1px solid #ded6ff;
  }

  .badge.other{
    color:var(--other);
    background:var(--other-bg);
    border:1px solid #cfe9dc;
  }

  dialog{
    width:min(760px,calc(100vw - 28px));
    border:0;
    border-radius:16px;
    padding:0;
    color:var(--ink);
    box-shadow:0 28px 80px rgba(26,37,47,.28);
  }

  dialog::backdrop{
    background:rgba(30,39,46,.38);
  }

  .dialog-body{
    padding:20px;
  }

  .dialog-body h2{
    margin:0 0 6px;
    font-size:19px;
  }

  .dialog-body p{
    margin:0 0 12px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }

  textarea{
    width:100%;
    min-height:380px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:11px;
    padding:12px;
    outline:0;
    color:var(--ink);
    background:#fbfcfd;
    font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  }

  textarea:focus{
    border-color:var(--zenn);
    box-shadow:0 0 0 3px rgba(62,168,255,.13);
  }

  .dialog-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
  }

  .danger{color:#c43745}

  .toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:100;
    max-width:min(420px,calc(100vw - 40px));
    padding:10px 14px;
    border-radius:10px;
    color:#fff;
    background:#34404a;
    box-shadow:var(--shadow);
    font-size:13px;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:.2s ease;
  }

  .toast.show{
    opacity:1;
    transform:translateY(0);
  }

  @media(max-width:760px){
    .page{
      width:min(100% - 16px,1280px);
      padding-top:14px;
    }

    .hero{
      align-items:flex-start;
      flex-direction:column;
      gap:8px;
    }

    .calendar-shell{
      height:calc(100vh - 212px);
    }

    .spacer{display:none}
  }

  @media print{
    @page{
      size:landscape;
      margin:7mm;
    }

    body{background:#fff}

    .page{
      width:100%;
      padding:0;
    }

    .hero,.toolbar,.legend{
      display:none!important;
    }

    .calendar-shell{
      height:auto;
      overflow:visible;
      border:0;
      box-shadow:none;
    }

    table{
      min-width:0;
      font-size:7px;
    }

    thead th,tbody th{
      position:static;
    }

    td{
      height:34px;
      padding:2px 3px;
    }

    .day-number{font-size:8px}

    .badge{
      padding:2px 3px;
      font-size:6.5px;
    }

    .month-chip,.today-chip{
      font-size:6px;
      padding:2px 3px;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="brand">
      <div class="brand-mark">年</div>
      <div>
        <h1>年間カレンダー</h1>
        <div class="subtitle">
          土曜始まり・月を分断しない週ベース表示
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="control" id="prevYear">← 前年</button>
    <select class="control" id="yearSelect"></select>
    <button class="control" id="nextYear">翌年 →</button>
    <button class="control" id="todayButton">今日へ</button>

    <div class="spacer"></div>

    <button class="control primary" id="editData">
      カレンダーデータを編集
    </button>

    <button class="control" id="printButton">
      印刷
    </button>
  </div>

  <div class="legend">
    <span class="legend-item">
      <span class="dot today"></span>
      今日
    </span>

    <span class="legend-item">
      <span class="dot holiday"></span>
      祝日
    </span>

    <span class="legend-item">
      <span class="dot important"></span>
      大事な日
    </span>

    <span>
      入力形式：YYYYMMDD,名称,分類
    </span>
  </div>

  <main class="calendar-shell" id="calendarShell">
    <table>
      <thead>
        <tr>
          <th>週</th>
          <th class="sat-head">土</th>
          <th class="sun-head">日</th>
          <th>月</th>
          <th>火</th>
          <th>水</th>
          <th>木</th>
          <th>金</th>
        </tr>
      </thead>

      <tbody id="calendarBody"></tbody>
    </table>
  </main>
</div>

<dialog id="dataDialog">
  <div class="dialog-body">

    <h2>カレンダーデータ</h2>

    <p>
      1行につき「YYYYMMDD,名称,分類」。<br>
      例：20260811,山の日,祝日<br>
      例：20260704,推し生誕日,大事な日<br>
      保存すると、このブラウザの localStorage に保持される。
    </p>

    <textarea id="dataText" spellcheck="false"></textarea>

    <div class="dialog-actions">
      <button class="control danger" id="resetData">
        初期データに戻す
      </button>

      <button class="control" id="closeDialog">
        閉じる
      </button>

      <button class="control primary" id="saveData">
        保存して反映
      </button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   初期データ

   localStorage に保存データがない最初の1回だけ使う。
   以後は textarea で保存した内容を読み込む。
   ========================================================= */

const defaultCalendarData = `20260101,元日,祝日
20260112,成人の日,祝日
20260211,建国記念の日,祝日
20260223,天皇誕生日,祝日
20260320,春分の日,祝日
20260429,昭和の日,祝日
20260503,憲法記念日,祝日
20260504,みどりの日,祝日
20260505,こどもの日,祝日
20260506,休日,祝日
20260720,海の日,祝日
20260811,山の日,祝日
20260921,敬老の日,祝日
20260922,休日,祝日
20260923,秋分の日,祝日
20261012,スポーツの日,祝日
20261103,文化の日,祝日
20261123,勤労感謝の日,祝日
20270101,元日,祝日
20270111,成人の日,祝日
20270211,建国記念の日,祝日
20270223,天皇誕生日,祝日
20270321,春分の日,祝日
20270322,休日,祝日
20270429,昭和の日,祝日
20270503,憲法記念日,祝日
20270504,みどりの日,祝日
20270505,こどもの日,祝日
20270719,海の日,祝日
20270811,山の日,祝日
20270920,敬老の日,祝日
20270923,秋分の日,祝日
20271011,スポーツの日,祝日
20271103,文化の日,祝日
20271123,勤労感謝の日,祝日`;

(() => {

  "use strict";

  const STORAGE_KEY =
    "annual-calendar-data-v3";

  const calendarBody =
    document.getElementById("calendarBody");

  const calendarShell =
    document.getElementById("calendarShell");

  const yearSelect =
    document.getElementById("yearSelect");

  const dataDialog =
    document.getElementById("dataDialog");

  const dataText =
    document.getElementById("dataText");

  const toast =
    document.getElementById("toast");

  const now = new Date();

  const currentYear =
    now.getFullYear();

  const todayKey =
    toCompactDate(now);

  let firstRender = true;


  function pad2(value){
    return String(value).padStart(2,"0");
  }


  function toCompactDate(date){

    return `${date.getFullYear()}${pad2(
      date.getMonth()+1
    )}${pad2(date.getDate())}`;

  }


  function readRawData(){

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved === null){

      localStorage.setItem(
        STORAGE_KEY,
        defaultCalendarData
      );

      return defaultCalendarData;
    }

    return saved;
  }


  function writeRawData(text){

    localStorage.setItem(
      STORAGE_KEY,
      text
    );

  }


  function parseCalendarData(source){

    const result = {};

    const lines =
      String(source)
      .replace(/^\uFEFF/,"")
      .split(/\r?\n/);

    for(const rawLine of lines){

      const line =
        rawLine.trim();

      if(!line) continue;

      const parts =
        line.split(/[,，\t]/);

      if(parts.length < 2) continue;

      const dateRaw =
        parts[0].trim();

      const title =
        parts[1].trim();

      const category =
        (parts[2] || "その他").trim();

      if(!/^\d{8}$/.test(dateRaw)){
        continue;
      }

      if(!title){
        continue;
      }

      const year =
        Number(dateRaw.slice(0,4));

      const month =
        Number(dateRaw.slice(4,6));

      const day =
        Number(dateRaw.slice(6,8));

      const test =
        new Date(year,month-1,day);

      if(
        test.getFullYear() !== year ||
        test.getMonth() !== month-1 ||
        test.getDate() !== day
      ){
        continue;
      }

      if(!result[dateRaw]){
        result[dateRaw] = [];
      }

      result[dateRaw].push({
        title,
        category
      });

    }

    return result;
  }


  function firstSaturdayWeekStart(year){

    const jan1 =
      new Date(year,0,1);

    const daysBack =
      (jan1.getDay() - 6 + 7) % 7;

    const start =
      new Date(jan1);

    start.setDate(
      jan1.getDate() - daysBack
    );

    return start;
  }


  function numberOfWeeks(year){

    const start =
      firstSaturdayWeekStart(year);

    const next =
      firstSaturdayWeekStart(year+1);

    return Math.round(
      (next-start) /
      (7*24*60*60*1000)
    );

  }


  function categoryClass(category){

    if(category === "祝日"){
      return "holiday";
    }

    if(category === "大事な日"){
      return "important";
    }

    return "other";
  }


  function createBadge(item){

    const badge =
      document.createElement("div");

    badge.className =
      `badge ${categoryClass(
        item.category
      )}`;

    badge.textContent =
      item.title;

    badge.title =
      `${item.title}［${item.category}］`;

    return badge;
  }


  function renderCalendar(){

    const year =
      Number(yearSelect.value);

    const data =
      parseCalendarData(
        readRawData()
      );

    const start =
      firstSaturdayWeekStart(year);

    const weeks =
      numberOfWeeks(year);

    calendarBody.innerHTML = "";


    for(
      let weekIndex=0;
      weekIndex<weeks;
      weekIndex++
    ){

      const row =
        document.createElement("tr");

      const weekHeader =
        document.createElement("th");

      weekHeader.textContent =
        `${weekIndex+1}週`;

      row.appendChild(
        weekHeader
      );


      for(
        let dayIndex=0;
        dayIndex<7;
        dayIndex++
      ){

        const date =
          new Date(start);

        date.setDate(
          start.getDate()
          + weekIndex*7
          + dayIndex
        );

        const key =
          toCompactDate(date);

        const items =
          data[key] || [];

        const isInYear =
          date.getFullYear() === year;

        const isToday =
          key === todayKey;

        const hasHoliday =
          items.some(
            item =>
              item.category === "祝日"
          );

        const cell =
          document.createElement("td");


        if(!isInYear){
          cell.classList.add("outside");
        }

        if(dayIndex === 0){
          cell.classList.add("sat");
        }

        if(dayIndex === 1){
          cell.classList.add("sun");
        }

        if(hasHoliday){
          cell.classList.add(
            "holiday-cell"
          );
        }

        if(isToday){
          cell.classList.add("today");
        }

        if(
          date.getDate() === 1 &&
          isInYear
        ){
          cell.classList.add(
            "month-start"
          );
        }

        cell.dataset.date = key;


        const dateRow =
          document.createElement("div");

        dateRow.className =
          "date-row";


        if(date.getDate() === 1){

          const monthChip =
            document.createElement("span");

          monthChip.className =
            "month-chip";

          monthChip.textContent =
            `${date.getMonth()+1}月`;

          dateRow.appendChild(
            monthChip
          );

        }


        const number =
          document.createElement("span");

        number.className =
          "day-number";

        number.textContent =
          date.getDate();

        dateRow.appendChild(
          number
        );


        if(isToday){

          const todayChip =
            document.createElement("span");

          todayChip.className =
            "today-chip";

          todayChip.textContent =
            "TODAY";

          dateRow.appendChild(
            todayChip
          );

        }


        cell.appendChild(
          dateRow
        );


        if(items.length){

          const badges =
            document.createElement("div");

          badges.className =
            "badges";

          for(const item of items){

            badges.appendChild(
              createBadge(item)
            );

          }

          cell.appendChild(
            badges
          );

        }


        row.appendChild(
          cell
        );

      }


      calendarBody.appendChild(
        row
      );

    }


    if(firstRender){

      firstRender = false;

      requestAnimationFrame(
        () => scrollToToday(false)
      );

    }else if(
      year !== currentYear
    ){

      calendarShell.scrollTop = 0;

    }

  }


  function scrollToToday(
    smooth=true
  ){

    if(
      Number(yearSelect.value)
      !== currentYear
    ){

      ensureYearOption(
        currentYear
      );

      yearSelect.value =
        currentYear;

      renderCalendar();

      requestAnimationFrame(
        () => scrollToToday(smooth)
      );

      return;
    }


    const cell =
      calendarBody.querySelector(
        `[data-date="${todayKey}"]`
      );

    if(!cell) return;


    const target =
      cell.offsetTop
      - calendarShell.clientHeight/2
      + cell.offsetHeight/2;


    calendarShell.scrollTo({
      top:Math.max(0,target),
      behavior:
        smooth
          ? "smooth"
          : "auto"
    });

  }


  function populateYears(){

    const minYear =
      currentYear-6;

    const maxYear =
      currentYear+12;


    for(
      let year=minYear;
      year<=maxYear;
      year++
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        year;

      option.textContent =
        `${year}年`;

      if(year === currentYear){
        option.selected = true;
      }

      yearSelect.appendChild(
        option
      );

    }

  }


  function ensureYearOption(year){

    const exists =
      [...yearSelect.options]
      .some(
        option =>
          Number(option.value)
          === year
      );

    if(exists) return;


    const option =
      document.createElement(
        "option"
      );

    option.value = year;

    option.textContent =
      `${year}年`;

    yearSelect.appendChild(
      option
    );

  }


  function changeYear(delta){

    const nextYear =
      Number(yearSelect.value)
      + delta;

    ensureYearOption(
      nextYear
    );

    yearSelect.value =
      nextYear;

    renderCalendar();

  }


  function showToast(message){

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      showToast.timer
    );

    showToast.timer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        2200
      );

  }


  document
    .getElementById("prevYear")
    .addEventListener(
      "click",
      () => changeYear(-1)
    );


  document
    .getElementById("nextYear")
    .addEventListener(
      "click",
      () => changeYear(1)
    );


  document
    .getElementById("todayButton")
    .addEventListener(
      "click",
      () => scrollToToday(true)
    );


  document
    .getElementById("printButton")
    .addEventListener(
      "click",
      () => window.print()
    );


  yearSelect.addEventListener(
    "change",
    renderCalendar
  );


  document
    .getElementById("editData")
    .addEventListener(
      "click",
      () => {

        dataText.value =
          readRawData();

        dataDialog.showModal();

      }
    );


  document
    .getElementById("closeDialog")
    .addEventListener(
      "click",
      () => {

        dataDialog.close();

      }
    );


  document
    .getElementById("saveData")
    .addEventListener(
      "click",
      () => {

        const raw =
          dataText.value.trim();

        writeRawData(raw);

        dataDialog.close();

        renderCalendar();

        showToast(
          "カレンダーデータを保存しました"
        );

      }
    );


  document
    .getElementById("resetData")
    .addEventListener(
      "click",
      () => {

        dataText.value =
          defaultCalendarData;

      }
    );


  populateYears();
  renderCalendar();

})();
</script>

</body>
</html>
